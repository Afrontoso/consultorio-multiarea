name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lê a versão do pnpm do campo packageManager do package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Client Prisma antes do turbo: o generate escreve no node_modules da
      # raiz (fora dos outputs das tasks), então não pode depender nem da
      # ordem do grafo nem de cache hit do turbo.
      - run: pnpm --filter @consultorio/db prisma:generate

      # Cache do turbo: reaproveita builds/testes de pacotes não alterados
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # O build do @consultorio/db roda `prisma generate` antes do tsc, e os
      # demais tasks dependem de ^build — o client Prisma sempre existe a tempo.
      - run: pnpm turbo run lint typecheck build test --cache-dir=.turbo
